[package]
edition = "2024"
name = "kg-embedded"
version = "0.1.0"
authors = ["brucewilcoxon <brucewilcoxon@twigi-bi.io>"]
resolver = "2"

[[bin]]
name = "kg-embedded"
path = "src/main.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "test-bevy-mc"
path = "bin/test-bevy-mc.rs"
test = false
doctest = false
bench = false

[dependencies]
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.6.1"
embedded-io-async = "0.6.1"
embedded-storage = "0.3.1"

cortex-m-rt = "0.7.3"

embassy-executor = { version = "0.7", features = ["task-arena-size-1024", "arch-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-sync = { version = "0.6" }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
cortex-m = { version = "0.7.6" }
embassy-rp = { version = "0.4", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }

static_cell = "2.1"
portable-atomic = { version = "1.11", features = ["critical-section"] }
bevy = { version = "0.16.0", default-features = false, features = ["default_no_std"]}
embedded-alloc = "0.6.0"

kg-core = { path = "../kg-core", default-features = false, features = ["embedded"]}
getrandom = { version = "0.3.2", default-features = false}
rand = { version = "0.8.5", default-features = false }

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"
