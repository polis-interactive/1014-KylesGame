[package]
name = "kg-core"
version = "0.1.0"
edition = "2024"
resolver = "3"


[dependencies]
bevy = { version = "0.16.0", default-features = false, features = ["default_no_std"]}
rand = { version = "0.8.5", default-features = false, features = ["small_rng"]}
# I will make these optional if I really have to...
defmt = "0.3"
smart-leds = "0.4.0"
# defmt = { version = "0.3", optional = true }
# smart-leds = {version = "0.4.0", optional = true}

[features]
default = ["desktop"]
desktop = []
web = []
# embedded = ["dep:smart-leds", "dep:defmt"]
embedded = []