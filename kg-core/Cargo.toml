[package]
name = "kg-core"
version = "0.1.0"
edition = "2024"
resolver = "3"


[dependencies]
bevy = { version = "0.16.0", default-features = false, features = ["default_no_std"]}
rand = { version = "0.9.1", default-features = false }
bevy_rand = { version = "0.10.0", default-features = false, features = ["wyrand"]}

[features]
default = ["desktop"]
desktop = []
web = ["bevy_rand/wasm_js"]
embedded = []
